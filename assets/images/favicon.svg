<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Outer Floor Slab Boundary -->
  <rect x="2" y="2" width="36" height="36" rx="2" fill="rgba(166, 130, 75, 0.12)" stroke="#A6824B" stroke-width="1.8" />
  <!-- Architectural Tile / Slab Grout Grid Lines -->
  <line x1="2" y1="20" x2="38" y2="20" stroke="#A6824B" stroke-width="1.4" opacity="0.85" />
  <line x1="20" y1="2" x2="20" y2="38" stroke="#A6824B" stroke-width="1.4" opacity="0.85" />
  <!-- Center Bookmatched Marble Medallion Inlay -->
  <polygon points="20,8 32,20 20,32 8,20" fill="rgba(166, 130, 75, 0.28)" stroke="#A6824B" stroke-width="1.5" />
  <!-- Inset Solid Stone Jewel -->
  <polygon points="20,14 26,20 20,26 14,20" fill="#A6824B" />
</svg>
